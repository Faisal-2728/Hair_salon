<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Premium Saloon Studio banner">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#f6b0c3"/>
    </linearGradient>
    <style>
      .bg { fill: url(#g); }
      .title { font-family: 'Segoe UI', Roboto, Arial, sans-serif; font-size:48px; fill:#2b2b2b; font-weight:700; }
      .subtitle { font-family: 'Segoe UI', Roboto, Arial, sans-serif; font-size:20px; fill:#332f2f; opacity:0.9; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="400" rx="16"/>
  <g transform="translate(80,120)">
    <text class="title">Premium Saloon Studio</text>
    <text class="subtitle" y="48">Luxury hair & beauty — Book your appointment today</text>
  </g>
</svg>
